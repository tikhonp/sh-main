# vim: ft=nginx:

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name mykpp.online;

    ssl_certificate     /etc/letsencrypt/live/mykpp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mykpp.online/privkey.pem;

    include /etc/nginx/conf.d/options/options-ssl-nginx.conf;

    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ALCS sends its own enforced Content-Security-Policy; a second one from
    # options-ssl-nginx.conf would be enforced too, and the browser applies
    # both. Any add_header here stops the server-level ones from being
    # inherited, so re-add everything except the CSP.
    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header QUIC-Status $http3;
        add_header x-quic 'h3';

        proxy_pass http://ssh-server:10001;
    }
}
