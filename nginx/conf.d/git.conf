# vim: ft=nginx:

# https://forgejo.org/docs/latest/admin/setup/reverse-proxy/
# HTTP only. Git over SSH skips nginx: ssh-server publishes :2222 to the
# tunnel port 10012 (compose.yaml).

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name git.tikhonnnnn.com;

    ssl_certificate     /etc/letsencrypt/live/git.tikhonnnnn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.tikhonnnnn.com/privkey.pem;

    include /etc/nginx/conf.d/options/options-ssl-nginx.conf;

    # Forgejo needs URL-encoded slashes in paths left as they are.
    merge_slashes off;

    client_max_body_size 512M;
    # Large git pushes and uploads stream to Forgejo instead of being
    # buffered to disk here first.
    proxy_request_buffering off;

    # Forgejo trusts these only from the tunnel's network
    # (REVERSE_PROXY_TRUSTED_PROXIES in sh-blackberry's forgejo.yaml).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # enable websockets: http://nginx.org/en/docs/http/websocket.html
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_redirect     off;

    # Long clones and pushes of big repositories.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    # Crawlers walking every commit and blame page are the usual load on a
    # public forge.
    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://ssh-server:10007;
    }
}
