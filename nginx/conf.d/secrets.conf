# vim: ft=nginx:

upstream vaultwarden-default {
    zone vaultwarden-default 64k;
    server ssh-server:10006;
    keepalive 2;
}

# Needed to support websocket connections
# See: https://nginx.org/en/docs/http/websocket.html
# Instead of "close" as stated in the above link we send an empty value.
# Else all keepalive connections will not work.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name secrets.tikhonnnnn.com;

    ssl_certificate     /etc/letsencrypt/live/secrets.tikhonnnnn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secrets.tikhonnnnn.com/privkey.pem;

    include /etc/nginx/conf.d/options/options-ssl-nginx.conf;

    client_max_body_size 525M;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 2FA/SSO connector pages (webauthn-connector.html, duo-redirect-connector.html, …)
    # are loaded in an iframe by the clients, so Vaultwarden deliberately serves them
    # without CSP / X-Frame-Options. Any add_header here stops the server-level ones from
    # options-ssl-nginx.conf being inherited, so re-add everything except the CSP.
    location ~ connector\.html$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header QUIC-Status $http3;
        add_header x-quic 'h3';

        proxy_pass http://vaultwarden-default;
    }

    location / {
        proxy_pass http://vaultwarden-default;
    }
}
