# vim: ft=nginx:

# Public link URLs carry their secret token in the path (/s/<token>, and later
# /r/, /f/). The JSON access log writes $uri as http_path, so these requests
# are left out of it; Proxier keeps its own fetch log with the token masked.
map $uri $proxier_log {
    ~^/(s|r|f)/ 0;
    default     1;
}

upstream proxier_tcp {
	server ssh-server:10005 fail_timeout=1s;
	keepalive 4;
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name proxier.tikhonnnnn.com;

    ssl_certificate     /etc/letsencrypt/live/proxier.tikhonnnnn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxier.tikhonnnnn.com/privkey.pem;

    include /etc/nginx/conf.d/options/options-ssl-nginx.conf;

    access_log /var/log/nginx/access.log json if=$proxier_log;

    # Template imports are up to 10 MB.
    client_max_body_size 10m;

    # Proxier signs the admin in itself and serves public link URLs (/s/, /r/,
    # /f/) to people without a login: no auth_basic here.
    location / {
        proxy_pass http://proxier_tcp;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The live job log is server-sent events: nothing may buffer it, and
        # the stream stays open for as long as the page is.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Proxier takes the client address from X-Real-IP, and only from the
        # tunnel's network (PROXIER_TRUSTED_PROXIES).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
