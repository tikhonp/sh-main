# Reap tunnel sessions whose client vanished without closing TCP (home
# WAN/NAT reset). Otherwise the dead session keeps its -R listener
# (10000-10011) for minutes to hours and every reconnect from the node
# fails with "remote port forwarding failed for listen port ...".
# Mirrors the clients' ServerAliveInterval=10 / ServerAliveCountMax=3.
ClientAliveInterval 10
ClientAliveCountMax 3
